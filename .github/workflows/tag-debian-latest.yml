name: Tag Debian As Latest

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: Docker image name (without username)
        required: false
        default: "nas-tools"
      source_tag:
        description: Source tag to copy from
        required: false
        default: "debian"
      target_tag:
        description: Target tag to overwrite
        required: false
        default: "latest"

jobs:
  retag:
    runs-on: ubuntu-latest
    name: Retag DockerHub Image
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Retag Manifest
        env:
          IMAGE: ${{ env.DOCKERHUB_USERNAME }}/${{ github.event.inputs.image_name }}
          SOURCE_TAG: ${{ github.event.inputs.source_tag }}
          TARGET_TAG: ${{ github.event.inputs.target_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${TARGET_TAG}" \
            "${IMAGE}:${SOURCE_TAG}"

      - name: Verify Target Tag
        env:
          IMAGE: ${{ env.DOCKERHUB_USERNAME }}/${{ github.event.inputs.image_name }}
          TARGET_TAG: ${{ github.event.inputs.target_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${TARGET_TAG}"
