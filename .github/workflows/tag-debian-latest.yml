name: Tag Debian As Latest

on:
  workflow_dispatch:
    inputs:
      docker_username:
        description: DockerHub username
        required: true
        default: ""
      docker_token:
        description: DockerHub access token
        required: true
        default: ""
      image_name:
        description: Docker image name (without username)
        required: false
        default: "nas-tools"
      source_tag:
        description: Source tag to copy from
        required: false
        default: "debian"
      target_tag:
        description: Target tag to overwrite
        required: false
        default: "latest"

jobs:
  retag:
    runs-on: ubuntu-latest
    name: Retag DockerHub Image
    permissions:
      contents: read
    steps:
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ github.event.inputs.docker_username }}
          password: ${{ github.event.inputs.docker_token }}

      - name: Retag Manifest
        env:
          IMAGE: ${{ github.event.inputs.docker_username }}/${{ github.event.inputs.image_name }}
          SOURCE_TAG: ${{ github.event.inputs.source_tag }}
          TARGET_TAG: ${{ github.event.inputs.target_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${TARGET_TAG}" \
            "${IMAGE}:${SOURCE_TAG}"

      - name: Verify Target Tag
        env:
          IMAGE: ${{ github.event.inputs.docker_username }}/${{ github.event.inputs.image_name }}
          TARGET_TAG: ${{ github.event.inputs.target_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${TARGET_TAG}"
