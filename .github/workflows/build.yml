name: NAStool Docker

on:
  workflow_dispatch:
    inputs:
      docker_username:
        description: DockerHub username (optional, fallback to secret)
        required: false
        default: ""
      docker_token:
        description: DockerHub access token (optional, fallback to secret)
        required: false
        default: ""
      build_alpine:
        description: Build Alpine image (true/false)
        required: false
        default: "false"
      build_debian:
        description: Build Debian image (true/false)
        required: false
        default: "true"

jobs:
  alpine:
    if: ${{ github.event.inputs.build_alpine == 'true' }}
    runs-on: ubuntu-latest
    name: Build Docker Image (Alpine)
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ github.event.inputs.docker_username || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ github.event.inputs.docker_token || secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release version
        id: release_version
        run: |
          app_version=$(sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp" version.py)
          echo "app_version=${app_version}" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_USERNAME }}/nas-tools
          tags: |
            type=raw,value=${{ env.app_version }}
            type=raw,value=latest

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  debian:
    if: ${{ github.event.inputs.build_debian != 'false' }}
    runs-on: ubuntu-latest
    name: Build Docker Image (Debian)
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ github.event.inputs.docker_username || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ github.event.inputs.docker_token || secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release version
        id: release_version
        run: |
          app_version=$(sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp" version.py)
          echo "app_version=${app_version}-debian" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_USERNAME }}/nas-tools
          tags: |
            type=raw,value=${{ env.app_version }}
            type=raw,value=debian

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/debian.Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
