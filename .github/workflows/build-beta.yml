name: NAStool Docker Beta
on:
  workflow_dispatch:

jobs:
  alpine:
    runs-on: ubuntu-latest
    name: Build Docker Beta Image (Alpine)
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6

      -
        name: Release version
        id: release_version
        run: |
          app_version=$(sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp" version.py)
          echo "app_version=${app_version}-beta" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_USERNAME }}/nas-tools
          tags: |
            type=raw,value=${{ env.app_version }}
            type=raw,value=beta

      -
        name: Set Up QEMU
        uses: docker/setup-qemu-action@v4

      -
        name: Set Up Buildx
        uses: docker/setup-buildx-action@v4

      -
        name: Login DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - 
        name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/beta.Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  debian:
    runs-on: ubuntu-latest
    name: Build Docker Beta Image (Debian)
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6

      -
        name: Release version
        id: release_version
        run: |
          app_version=$(sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp" version.py)
          echo "app_version=${app_version}-debian-beta" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_USERNAME }}/nas-tools
          tags: |
            type=raw,value=${{ env.app_version }}
            type=raw,value=debian-beta

      -
        name: Set Up QEMU
        uses: docker/setup-qemu-action@v4

      -
        name: Set Up Buildx
        uses: docker/setup-buildx-action@v4

      -
        name: Login DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - 
        name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/debian-beta.Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
